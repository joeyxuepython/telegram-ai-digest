name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip uv
      - run: uv sync --frozen --extra dev --extra web
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m ruff check .
      - run: uv run --no-sync python -m ruff format --check .
      - run: uv build
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/tad-smoke
          /tmp/tad-smoke/bin/python -m pip install dist/*.whl
          /tmp/tad-smoke/bin/tad --help
