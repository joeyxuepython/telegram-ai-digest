[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ai-digest"
version = "0.1.0"
description = "AI-powered daily/weekly digests for busy Telegram groups"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "joe", email = "joe@example.com"}]
keywords = ["telegram", "ai", "summarizer", "openai", "digest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

[project.optional-dependencies]
web = ["fastapi>=0.104", "uvicorn>=0.24", "jinja2>=3.1"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "black>=24", "ruff>=0.3"]

[project.urls]
Homepage = "https://github.com/joeyxuepython/telegram-ai-digest"
Repository = "https://github.com/joeyxuepython/telegram-ai-digest"
Issues = "https://github.com/joeyxuepython/telegram-ai-digest/issues"

[project.scripts]
tad = "src.cli:main"
tad-web = "src.web:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
